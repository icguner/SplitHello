name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (fmt, clippy, tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  rust-fuzz-smoke:
    name: Rust parser fuzz smoke (cargo-fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked

      - name: Run each target for 20 seconds
        run: |
          cargo +nightly fuzz run fuzz_tls -- -dict=fuzz/tls.dict -max_total_time=20 -timeout=2 -max_len=65536
          cargo +nightly fuzz run fuzz_dns -- -dict=fuzz/dns.dict -max_total_time=20 -timeout=2 -max_len=65536
          cargo +nightly fuzz run fuzz_adblock -- -max_total_time=20 -timeout=2 -max_len=65536

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-fuzz-crashes
          if-no-files-found: ignore
          retention-days: 14
          path: fuzz/artifacts/

  windows-release:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked -p splithello

      - name: WinDivert runtime (pinned SHA-256)
        run: ./installer/fetch-windivert.ps1 -OutDir target/release

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: splithello-windows-x64-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            target/release/splithello.exe
            target/release/WinDivert.dll
            target/release/WinDivert64.sys
            target/release/WinDivert-LICENSE.txt

  worker-syntax:
    name: Worker JavaScript syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: node --check worker/src/index.js
        run: |
          # The Worker is an ES module (`import ...`) with no package.json beside it,
          # so Node would parse it as CommonJS; check an .mjs copy instead.
          cp worker/src/index.js "$RUNNER_TEMP/worker.mjs"
          node --check "$RUNNER_TEMP/worker.mjs"
