[package]
name = "sh-core"
description = "Platform plumbing shared by every SplitHello component (files, config, logging, live stats)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
serde_json = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
]

[lints]
workspace = true
