[package]
name = "sh-net"
description = "Outbound networking: HTTPS to the Worker (DoH) and for list downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["net", "time", "rt", "macros", "io-util", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
