[package]
name = "sh-divert"
description = "WinDivert packet interception: rewrite rules, packet strategies and process scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sh-core = { path = "../sh-core" }
sh-flow = { path = "../sh-flow" }
sh-proto = { path = "../sh-proto" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[dev-dependencies]
sh-proto = { path = "../sh-proto", features = ["testing"] }

[lints]
workspace = true
