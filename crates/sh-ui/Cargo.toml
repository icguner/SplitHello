[package]
name = "sh-ui"
description = "Tray, engine supervisor, startup task and the egui panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
sh-core = { path = "../sh-core" }
sh-divert = { path = "../sh-divert" }
sh-engine = { path = "../sh-engine" }
sh-net = { path = "../sh-net" }
sh-strategy = { path = "../sh-strategy" }
sh-telemetry = { path = "../sh-telemetry" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
