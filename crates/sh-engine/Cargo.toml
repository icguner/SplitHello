[package]
name = "sh-engine"
description = "Engine composition: command line, start/stop order, ad-block list updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sh-adblock = { path = "../sh-adblock" }
sh-core = { path = "../sh-core" }
sh-divert = { path = "../sh-divert" }
sh-dns = { path = "../sh-dns" }
sh-flow = { path = "../sh-flow" }
sh-net = { path = "../sh-net" }
sh-proto = { path = "../sh-proto" }
sh-setup = { path = "../sh-setup" }
sh-strategy = { path = "../sh-strategy" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
