<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="319" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- lane 1: address lookup -->
  <text x="30" y="36" font-size="12" font-weight="600" letter-spacing="1" fill="#57606a">1 · ADRES SORGUSU (DNS)</text>

  <rect x="30" y="56" width="130" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="95" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Uygulama</text>

  <line x1="160" y1="88" x2="204" y2="88" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="56" width="150" height="64" rx="12" fill="#1f6feb"/>
  <text x="285" y="93" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SplitHello</text>

  <line x1="360" y1="88" x2="614" y2="88" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <text x="488" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6feb">şifreli HTTPS</text>

  <!-- the ISP sits on the path but only sees HTTPS -->
  <rect x="418" y="100" width="140" height="44" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 4"/>
  <text x="488" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="#57606a">İnternet sağlayıcı</text>
  <text x="488" y="135" text-anchor="middle" font-size="11" fill="#8c959f">yalnızca HTTPS görür</text>

  <rect x="620" y="50" width="230" height="76" rx="12" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="735" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Senin Worker'ın</text>
  <text x="735" y="102" text-anchor="middle" font-size="12" fill="#57606a">Cloudflare, ücretsiz hesap</text>

  <!-- divider -->
  <line x1="30" y1="178" x2="850" y2="178" stroke="#d0d7de"/>

  <!-- lane 2: page traffic -->
  <text x="30" y="212" font-size="12" font-weight="600" letter-spacing="1" fill="#57606a">2 · SAYFA TRAFİĞİ</text>

  <rect x="30" y="232" width="130" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="95" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Uygulama</text>

  <line x1="160" y1="264" x2="204" y2="264" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="232" width="150" height="64" rx="12" fill="#1f6feb"/>
  <text x="285" y="269" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SplitHello</text>

  <line x1="360" y1="264" x2="614" y2="264" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="488" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#57606a">doğrudan, Worker'a uğramaz</text>

  <rect x="620" y="232" width="230" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="735" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Site</text>
</svg>
